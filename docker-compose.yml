# Mercado Libre trends pipeline: `docker compose up -d` starts everything.
# Every variable has a default; put overrides and the Mercado Libre credentials in .env.
name: meli_trends_pipeline

x-dagster-environment: &dagster-environment
  DAGSTER_POSTGRES_HOST: dagster-postgres
  DAGSTER_POSTGRES_DB: dagster
  DAGSTER_POSTGRES_USER: dagster
  DAGSTER_POSTGRES_PASSWORD: ${DAGSTER_POSTGRES_PASSWORD:-dagster}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-snowflake_dev}
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
  MINIO_BUCKET: ${MINIO_BUCKET:-meli-datalake}
  ML_CLIENT_ID: ${ML_CLIENT_ID:-}
  ML_CLIENT_SECRET: ${ML_CLIENT_SECRET:-}
  ML_GRANT_TYPE: ${ML_GRANT_TYPE:-client_credentials}
  PIPELINE_TIMEZONE: ${PIPELINE_TIMEZONE:-America/Argentina/Buenos_Aires}
  PIPELINE_SCHEDULE_CRON: "${PIPELINE_SCHEDULE_CRON:-0 23 * * *}"
  PIPELINE_RUN_ON_STARTUP: ${PIPELINE_RUN_ON_STARTUP:-true}
  MELI_SELECTED_SUBCATEGORIES_ONLY: ${MELI_SELECTED_SUBCATEGORIES_ONLY:-true}
  MELI_MAX_WORKERS: ${MELI_MAX_WORKERS:-4}
  MATCHING_FUZZY_ENABLED: ${MATCHING_FUZZY_ENABLED:-true}

x-dagster-service: &dagster-service
  image: meli-trends-pipeline/dagster:2.0.0
  build:
    context: .
    dockerfile: docker/dagster/Dockerfile
  environment: *dagster-environment
  volumes:
    - dagster_storage:/opt/dagster/dagster_home/storage
  restart: unless-stopped

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-snowflake_dev}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${POSTGRES_EXTERNAL_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  dagster-postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: dagster
      POSTGRES_USER: dagster
      POSTGRES_PASSWORD: ${DAGSTER_POSTGRES_PASSWORD:-dagster}
    volumes:
      - dagster_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dagster -d dagster"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${HOST_BIND_IP:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: pgsty/mc:RELEASE.2026-10-18T00-00-00Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-meli-datalake}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        && mc mb --ignore-existing "local/$${MINIO_BUCKET}"
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  dagster-code:
    <<: *dagster-service
    command: ["dagster", "api", "grpc", "--host", "0.0.0.0", "--port", "4000", "--module-name", "meli_trends_pipeline.definitions"]
    healthcheck:
      test: ["CMD", "dagster", "api", "grpc-health-check", "--port", "4000"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      dagster-postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  dagster-webserver:
    <<: *dagster-service
    # Creates/upgrades the Dagster storage schema before serving the UI.
    command:
      - sh
      - -c
      - dagster instance migrate && exec dagster-webserver --host 0.0.0.0 --port 3000 --workspace /opt/dagster/dagster_home/workspace.yaml
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${DAGSTER_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/server_info', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    depends_on:
      dagster-postgres:
        condition: service_healthy
      dagster-code:
        condition: service_healthy

  dagster-daemon:
    <<: *dagster-service
    command: ["dagster-daemon", "run", "--workspace", "/opt/dagster/dagster_home/workspace.yaml"]
    depends_on:
      dagster-webserver:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  superset:
    image: meli-trends-pipeline/superset:4.1.1
    build:
      context: .
      dockerfile: docker/superset/Dockerfile
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-meli-trends-pipeline-local-only-change-me-7f3c9a1e5b2d}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
      ANALYTICS_DB_DISPLAY_NAME: MeLi Trends (PostgreSQL)
      ANALYTICS_DB_HOST: postgres
      ANALYTICS_DB_PORT: "5432"
      ANALYTICS_DB_NAME: ${POSTGRES_DB:-snowflake_dev}
      ANALYTICS_DB_USER: ${POSTGRES_USER:-postgres}
      ANALYTICS_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${SUPERSET_PORT:-8088}:8088"
    volumes:
      - superset_home:/app/superset_home
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8088/health"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  dozzle:
    image: amir20/dozzle:v8.14.0
    environment:
      DOZZLE_FILTER: label=com.docker.compose.project=meli_trends_pipeline
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${DOZZLE_PORT:-8888}:8080"
    restart: unless-stopped

  adminer:
    image: adminer:5.3.0
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${ADMINER_PORT:-8082}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  dagster_postgres_data:
  dagster_storage:
  minio_data:
  superset_home:
